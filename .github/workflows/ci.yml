name: Basic CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck || npm run lint || echo "Skipping typecheck"

      - name: Build app
        env:
          # Dummy envs so build doesn't fail
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          AUTH_SECRET: "dummy"
          AWS_ACCESS_KEY_ID: "dummy"
          AWS_SECRET_ACCESS_KEY: "dummy"
          AWS_REGION: "us-east-1"
          S3_BUCKET_NAME: "dummy"
          PROCESS_VIDEO_ENDPOINT: "http://localhost"
          PROCESS_VIDEO_ENDPOINT_AUTH: "dummy"
          BASE_URL: "http://localhost:3000"
          SKIP_ENV_VALIDATION: "true"
        run: npm run build
